<HEAD>

<SCRIPT>

function postPad(s, n) {
	s = s.toString();
	for (var i=s.length; i<n; i++) s = s + " ";
	return s;
}
function prePad(s, n) {
	s = s.toString();
	for (var i=s.length; i<n; i++) s = " " + s;
	return s;
}

var string1 = "<PRE>" +
"             The Interactive MJS College Football Standings\n" +
"                            " + scoresDate + "\n" +
"\n" +
"In this interactive version of the " +
"<a href=\"./summary.htm\" target=\"_top\">" +
"MJS College Football Standings</a>, you\n" +
"can change the result of one or more games and see how the standings\n" +
"change.  To change a game result, use the form on the left.  You can\n" +
"click on any of the links below to expedite filling the form.\n" +
"</PRE>";

var string2 = "" +
"In the standings below, the following game results are the reverse of<BR>" +
"what actually occurred:<BR><BR>"; 

var string3 = "<BR>" +
"The original standing of a team is included in parentheses.<BR><BR>";

function onPageShowHandler(rightCookie) {


	/*
	Get here from onPageShow event.  This event is specific to
	Firefox browser and occurs whenever right frame is redrawn,
	including when redrawn by user hitting back button.

	The reason for this handler is that the "document.replace()"
	logic doesn't work on Firefox as it does in Internet Explorer.
	This gives the Firefox user the ability to hit the back button
	and mess up sync between right and left frames.  This handler
	checks for out-of-sync and restores sync if needed.
	*/

	// First check that rightCookie is not null.  For reasons not
	// clear, onPageShow fires several times when back button is hit,
	// and only one of those is the one we care about.  The ones we
	// don't care about have a null rightCookie, so ignore those
	// and take no action.
	//
	if (rightCookie == "") return; 

	// Check that right and left frames are in sync by comparing what
	// each thinks the cookie is.
	//
	var leftCookie = reverse.currentCookie;

	if (rightCookie != leftCookie) {

		// Out of sync.  Alert user not to hit back button.
		//
		alert(
		  "Please do not use your Internet browser's navigation controls.\n" +
		  "Use only the controls in the Interactive Standings.");

		// Restore sync by brute force.  Reload this frame (left),
		// which rewrites right frame to match leftCookie.
		//
		location.reload(true);
	}
}

function calc_standings(destDoc) {

	var nteams = team.length;
	var nreverse = reverse.game.length;

	function revAnchor(n1, n2, label) {
		var url = "javascript:parent.left.document.myForm.selectAll" +
		          "(" + n1 + "," + n2 + ")";
		/*
		var mouseOver = "parent.status='" + 
						 parent.left.team[n1].name + " beat " +
						 parent.left.team[n2].name + 
						 "'; return true";
		var mouseOut = "parent.status=''";
		*/
		return '<A ' +
		       'HREF="' + url + '" ' +
			   //'onMouseOver="' + mouseOver + '" ' +
			   //'onMouseOut="' + mouseOut + '" ' + 
			   '>' + label + '</A>';
	}

	function teamAnchor(n1) {
		return revAnchor(n1, n1, team[n1].name);
	}

	parent.status = "Calculating standings ... ";

	// Select desired name for the non-division-IA team.
	team[0].name = "not_div_1a";

	// Get length of longest team name.
	team.nameLength = 0;
	for (var i=0; i<nteams; i++) {
		var l = team[i].name.length;
		if (l > team.nameLength) team.nameLength = l;
	}

	// Add team number to each team object
	for (var i=0; i<nteams; i++) {
		team[i].num = i;
	}

	// Compute the right hand side (rhs) of the system of equations.
	// For each team, rhs entry is (# of wins - # of losses).
	//
	for (var i=0; i<nteams; i++) {
		team[i].rhs = team[i].wins.length - team[i].losses.length;
	}

	// Compute the ratings as matrix * rhs
	//
	for (var i=0; i < nteams; i++) {
		var sum = 0;
		for (var j=0; j<nteams; j++) {
			sum += matrix[i][j] * team[j].rhs;
		}
		team[i].rating = sum;
	}

	// Now sort the teams by rating, producing array ranking[].  Each
	// element of ranking[] is a team object.  Arrays team[] and
	// ranking[] contain the same team objects, but in different order
	// -- team[] is ordered by team number, ranking[] is ordered by
	// rating, in descending order.
	//
	// One detail:  ranking[0] is team "not_div_1a", regardless of its
	// rating.  Then ranking[1,2,...,nteams] hold the Div1A teams in
	// descending order of rating.
	//
	var ranking = new Array();
	for (var i=0; i < nteams; i++) {
		ranking[i] = team[i];
	}
	ranking.sort( function(t1, t2) {

		/*
		Args t1 and t2 are team objects, to be sorted according
		to rating.  Return (t2.rating - t1.rating), for
		descending order.

		The case of team number 0 requires special handling.
		This is the "not_div_1a" team, which we want to end up
		at ranking[0].  So check for this case and handle
		accordingly.
		*/

		if (t1.num == 0) return -1;  // t1 is not_div_1a
		if (t2.num == 0) return 1;   // t2 is not_div_1a
		return t2.rating - t1.rating;
	});

	// Add ranking member to each team object
	for (var i=0;  i < nteams; i++) {
		ranking[i].ranking = i;
	}

	// If no reversals in effect, save this as the true ranking
	if (nreverse == 0) {
		for (var i=0;  i < nteams; i++) {
			ranking[i].trueRanking = i;
		}
	}


	// Print out the ranking report
	//

	// Use "location.replace()" to prevent a new entry in the history
	// list.  Otherwise, use of the browser's "back" and "forward"
	// buttons can cause display to get out of sync with program state.
	//
	destDoc.location.replace("about:blank"); 
	destDoc.close();
	destDoc.open();

	var ops = 'onPageShow="parent.left.onPageShowHandler(' +
	          "'" + reverse.currentCookie + "'" +
	          ')"';
	destDoc.write('<html><body link="blue" vlink="blue" ' + ops + '><tt>');

	destDoc.write(string1);

	// Print out summary of game reversals, if any.
	// These are links that ease undoing the reversal.
	//
	if (nreverse > 0) {
		destDoc.write(string2);
		for (var i=0; i<reverse.game.length; i++) {
			var nw = reverse.game[i][1];
			var nl = reverse.game[i][0];
			var winner = team[nw].name; // new winner
			var loser  = team[nl].name; // new loser 
			var rankw = team[nw].ranking;
			var rankl = team[nl].ranking;
			if (rankw == 0) rankw = "x";
			if (rankl == 0) rankl = "x";
			var str = rankw + "-" + winner + " beat " + 
			          rankl + "-" + loser;
			str = revAnchor(nw, nl, str) + "<BR>";
			destDoc.write("&nbsp;&nbsp;", str);
		}
		destDoc.write(string3);
	}

	// Print column headings
	//
	var str = "";
	str += prePad("Team", 9);
	if (nreverse > 0) str += prePad("", 6);
	str += prePad("W-L", 18);
	str += "  Beat / Lost to (x = not FBS)";
	str += "<BR>";
	str = str.replace(/ /g, "&nbsp;"); 
	destDoc.write(str);

	for (var i=1; i<nteams; i++) {

		// Gather data for this team
		var name = ranking[i].name;
		var anchor = teamAnchor(ranking[i].num);
		var nwins = ranking[i].wins.length;
		var nlosses = ranking[i].losses.length;
		var wl = nwins + "-" + nlosses;

		// Build the "Beat" summary for this team
		//
		var beat = new Array();
		for (var j=0; j<nwins; j++) {
			beat[j] = new Object();
			var n = ranking[i].wins[j];  // losing team's number
			beat[j].num = n;
			n = team[n].ranking;         // losing team's ranking
			if (n == 0) n = "x";         // show not_div_1a as "x"
			beat[j].rank = n;
		}
		beat.sort( beat.sortKernel = function(a,b) {

			// Sort descending, with "x" last

			if (a.rank == "x") return 1;
			if (b.rank == "x") return -1;
			return a.rank - b.rank;
		});

		// Build the "Lost to" summary for this team.
		//
		var lostTo = new Array();
		for (var j=0; j<nlosses; j++) {
			lostTo[j] = new Object();
			var n = ranking[i].losses[j]; // winning team's number
			lostTo[j].num = n;
			n = team[n].ranking;          // winning team's ranking
			if (n == 0) n = "x";          // show not_div_1a as "x"
			lostTo[j].rank = n;
		}
		lostTo.sort(beat.sortKernel);     // sort in same way as "Beat"

		// Print it out
		//
		var str = "";
		str += prePad(i,3) + "  "; // ranking
		if (nreverse == 0) {
			str += postPad(name, team.nameLength + 1); // team name
		}
		else {
			var s = name + " (" + ranking[i].trueRanking + ")";
			str += postPad(s, team.nameLength + 7); // team name
		}
		str += prePad(wl, 4) + postPad("", 2);     // W-L
		//
		// Replace spaces with &nbsp's, to preserve alignment.  
		str = str.replace(/ /g, "&nbsp;"); 

		// Replace name with anchor.
		// This gives link for selecting reversal.
		var temp = str.split(name);
		str = temp[0] + anchor + temp[1];

		// 
		// Beat / Lost to summary.
		// These are links for selecting reversal.
		//
		if (nwins > 0) {
			for (var j=0; j<nwins; j++) {
				str += revAnchor(ranking[i].num, beat[j].num, beat[j].rank);
				str += " ";
			}
		}
		str += "/";
		if (nlosses > 0) {
			for (var j=0; j<nlosses; j++) {
				str += " ";
				str += revAnchor(lostTo[j].num, ranking[i].num, lostTo[j].rank);
			}
		}
		str += "<BR>";

		// Send it out
		destDoc.write(str);
	}
	destDoc.write("</TT></BODY>");

	parent.status = "Done";

}

// Global variables (also those in inter_data.js)
function dw(msg) {document.write(msg);}
var rdoc = parent.right.document;
var nteams = team.length;

function reverse(winner, loser) {


	// Convert winner's win to loss
	//
	var w = team[winner].wins;
	for (var i=0; i<w.length; i++) {
		if (w[i] == loser) {
			w.splice(i,1);  // delete the win
			break;
		}
	}
	team[winner].losses.push(loser);  // add the loss

	// Convert loser's loss to win
	//
	var l = team[loser].losses;
	for (var i=0; i<l.length; i++) {
		if (l[i] == winner) {
			l.splice(i,1);  // delete the loss
			break;
		}
	}
	team[loser].wins.push(winner);  // add the win

	// Update reverse.game[] array.  If this reversal undoes an entry
	// already in the array, then delete that entry.  Otherwise add
	// this reversal to array.
	//
	var newReversal = true;
	for (var i=0; i<reverse.game.length; i++) {
		var w = reverse.game[i][0];
		var l = reverse.game[i][1];
		if ((w == loser) && (l == winner)) {
			// This reversal undoes a previous reversal, so
			// just delete previous.
			reverse.game.splice(i, 1);
			newReversal = false;
			break;
		}
	}
	if (newReversal) {
		// This reversal does not undo any previous reversal, so 
		// add it to array.
		reverse.game.push([winner,loser]);
	}

	// Save reversals to a cookie.
	reverse.exportCookie();
}
reverse.game = new Array();

reverse.exportCookie = function() {

	// Export reverse.game[] array to a cookie.  This makes it possible
	// to restore reversals if user goes to a different document then
	// returns here.  This is a session cookie, it goes away when
	// browser closed.

	var str = "";
	for (var i=0; i<reverse.game.length; i++) {
		str += "a" + reverse.game[i][0] + "b" + reverse.game[i][1];
	}

	// Format str for export as cookie
	str = escape(str);
	str = reverse.cookieID + "=" + str;

	// Export cookie and save a copy
	document.cookie = str;
	reverse.currentCookie = str; 
	//alert("Export cookie:\n" + reverse.currentCookie);

}
reverse.cookieID = "MJS_inter_reversals";
reverse.currentCookie = "";

reverse.importCookie = function() {

	// Import saved cookie and implement reversals it describes.
	// Return the number of reversals performed.
	// If no cookie is found, do nothing and return 0.

	// Note:  no error checking is performed on the reversal data.  It
	// is assumed that the cookie value is formed by exportCookie().
	// If the data gets corrupted, or a user figures out how to change
	// it and screws it up, well, things will be a mess...

	var str = document.cookie;
	//alert("Import cookie:\n" + str);

	// Get substring that begins with cookie value
	var p = str.indexOf(reverse.cookieID + "=");
	if (p < 0) {
		// No cookie found
		return 0;   
	}
	p += reverse.cookieID.length + 1;
	str = str.substring(p);

	// Delete any suffix of form ";....."
	p = str.indexOf(";");
	if (p > 0) {
		str = str.substring(0, p);
	}

	// Save copy of imported cookie, then unescape
	reverse.currentCookie = str;
	str = unescape(str);
	//alert("Import cookie:\n" + reverse.currentCookie);

	// Now str is of form "aNbMaNbM...", where N and M are the numbers
	// of teams involved in a reversal.

	// Split str along "a", forming an array of strings "NbM".  Element
	// 0 of the array is meaningless, since there is nothing useful
	// preceding first "a", so delete element 0.
	//
	var revs = str.split("a");
	if (revs.length < 2) {
		// No reversals found.
		return 0;
	}
	revs.shift();  // delete element 0

	// Now apply reversal described by each element of array.
	//
	for (var i=0; i<revs.length; i++) {
		var x = revs[i].split("b");
		reverse(x[0], x[1]);
	}

	// Return number of reversals performed
	return revs.length;
}

reverse.undoAll = function() {
	var n = reverse.game.length;

	// Nothing to do if no reversals exist
	if (n <= 0) return 0;

	// Confirm request, do nothing if not confirmed
	var msg = "Are you sure you want to undo all game reversals\n" +
	          "and restore the original standings?";
	if (!confirm(msg)) return 0;

	// Undo each entry in reverse.game[] array by calling reverse().
	// Work backwards from the end of the array, because reverse()
	// deletes the entry.
	//
	for (var i=n-1; i>=0; i--) {
		reverse(reverse.game[i][1], reverse.game[i][0]);
	}

	// Return number of undone reversals.
	return n;
}

</SCRIPT>

<SCRIPT>
dw("<FORM NAME=myForm>");

 dw("<SELECT NAME=teamSelect>");
 dw("</SELECT><BR>");

 dw("<SELECT NAME=gameSelect>");
 dw("</SELECT><BR>");

 dw("Reverse this result?<BR>");
 dw("<INPUT TYPE=button NAME=okButton VALUE=OK> ");
 dw("<INPUT TYPE=button NAME=cancelButton VALUE=Cancel><BR>");

 dw("<BR><BR><BR><BR><BR>" +
    "Undo all reversals and restore original standings?<BR>");
 dw("<INPUT TYPE=button NAME=undoButton VALUE=OK> ");

dw("</FORM>");

myForm.gameSelect.init = function() {
	// Delete all selection options
	myForm.gameSelect.options.length = 0;

	// Initialize last control in daisy chain 
	myForm.okButton.enabled = false;
}

myForm.teamSelect.init = function() {

	// Build up selection options
	// Options with values 1 to nteams are teams.
	// Options with value 0 are header.
	//
	var options = myForm.teamSelect.options;
	options.length = 0;
	var index = 0;
	var def = true;  // defaultSelected
	options[index++] = new Option("Select a team", 0, def);
	options[index++] = new Option("----------", 0);
	for (var i=1; i<nteams; i++) {
		options[index++] = new Option(team[i].name, i);
	}

	// Initialize next control in daisy chain.
	myForm.gameSelect.init();
}

myForm.init = function() {
	// Initialize first control in daisy chain
	myForm.teamSelect.init();
}

myForm.gameSelect.update = function(teamNum) {

	// Generate game selection options for team[teamNum]

	var gs = myForm.gameSelect;
	var i;

	gs.init();

	var nwins = team[teamNum].wins.length;
	var nlosses = team[teamNum].losses.length;
	var opps = new Array();


	// "Beat" opponents
	for (i=0; i < nwins; i++) {
		var n = team[teamNum].wins[i];
		var s = "beat " + team[n].name + "," + n;
		opps[i] = s;  // a string such as "beat canada_st,17"
	}

	// "Lost to" opponents
	for (i=0; i < nlosses; i++) {
		var n = team[teamNum].losses[i];
		var s = "lost to " + team[n].name + "," + n;
		opps[i + nwins] = s; // a string such as "lost to canada_st,17"
	}
	opps.sort();  // sort alphabetically

	// Build up selection options.  Options with values 0 are header.
	// Options with nonzero values are game results, encoded e.g.  as
	// "b17" or "l17", meaning "beat" or "lost to" team number 17.
	//
	var def = true; // defaultSelected
	gs.options[0] = new Option("Select a game", 0, def);
	gs.options[1] = new Option("----------", 0);
	for (i=0; i < (nwins + nlosses); i++) {
		var a = opps[i].split(",");
		var text = a[0];  // e.g. "beat canada_st" or "lost to canada_st"
		var value = text.charAt(0) + a[1];  // e.g. "b17" or "l17"
		gs.options[i+2] = new Option(text, value);
	}
}

myForm.teamSelect.onchange = function() {

	var ts = myForm.teamSelect;  // (= this) 

	if (ts.value == 0) {
		// If header selected, just re-init and return.
		ts.init();
		return;
	}

	// A team selected.  Update gameSelect accordingly.
	myForm.gameSelect.update(ts.value);
}

myForm.teamSelect.select = function(n) {
	// Select team number n, as if user had done so
	var ts = myForm.teamSelect;  // (= this) 
	for (var i=0; i<ts.options.length; i++) {
		if (ts.options[i].value == n) {
			ts.selectedIndex = i;
			break;
		}
	}
	myForm.teamSelect.onchange();
}

myForm.gameSelect.onchange = function() {

	var gs = myForm.gameSelect;  // (= this)
	var ts = myForm.teamSelect; 

	if (gs.value == 0) {
		// If header selected, just re-init and return.
		gs.update(ts.value);
		return;
	}

	// A game selected.  Get team number of winner and loser. 
	//
	var b_or_l = gs.value.charAt(0);
	var n = gs.value.substring(1);
	if (b_or_l == "b") {
		myForm.winner = ts.value;
		myForm.loser = n;
	}
	else {
		myForm.loser = ts.value;
		myForm.winner = n;
	}

	// Enable the OK button for user to initiate reversal
	myForm.okButton.enabled = true;
}

myForm.gameSelect.select = function(n) {
	// Select result of team n, as if user had done so
	var gs = myForm.gameSelect;  // (= this) 
	for (var i=0; i<gs.options.length; i++) {
		if (gs.options[i].value == n) {
			gs.selectedIndex = i;
			break;
		}
	}
	myForm.gameSelect.onchange();
}

myForm.selectAll = function(n1, n2) {

	// Fill out form with team n1 as winner, team n2 as loser

	if (n1 != 0) {
		n2 = "b" + n2;
	}
	else {
		// Team n1 is not_div_1a.  Can't have it as first team,
		// since not an option for teamSelect.
		// So make it second team.
		n1 = n2;
		n2 = "l0";
	}

	myForm.init();
	myForm.teamSelect.select(n1);
	myForm.gameSelect.select(n2);
}

myForm.okButton.onclick = function() {

	// If OK button is not enabled, do nothing.
	if (!myForm.okButton.enabled) return;

	// Do the reversal.
	reverse(myForm.winner, myForm.loser);

	// Calculate and display the new rankings.
	//
	calc_standings(rdoc);
	rdoc.close();

	// Reset the form
	myForm.init();

}

myForm.undoButton.onclick = function() {

	// Reverse all games
	var n = reverse.undoAll();

	// If no games were reversed, nothing to do.
	if (n <= 0) return;

	// Calculate and display the new rankings.
	//
	calc_standings(rdoc);
	rdoc.close();

	// Reset the form
	myForm.init();
}

myForm.cancelButton.onclick = function() {
	myForm.init();  // Reset the form
}

// Get things started by initializing the form and calculating the standings.
//
myForm.init();
calc_standings(rdoc);
rdoc.close();

// Import and execute any reversals found in cookie.  If any found,
// recalculate standings.
//
var n = reverse.importCookie();
if (n > 0) {
	calc_standings(rdoc);
	rdoc.close();
}

</SCRIPT>
